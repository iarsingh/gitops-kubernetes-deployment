apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gitops-kubernetes-deployment
    app.kubernetes.io/environment: staging
  annotations:
    # Documents the promotion gate for humans and tooling. Actual enforcement is
    # the combination of (a) the nonprod project's business-hours sync window and
    # (b) the Argo Rollouts canary analysis that must pass before 100% traffic.
    sample-api.gitops/promotion-gate: "canary-analysis + business-hours-sync-window"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sample-api-nonprod
  source:
    repoURL: https://github.com/iarsingh/gitops-kubernetes-deployment.git
    targetRevision: main
    path: applications/sample-api/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-api-staging
  # Staging is automated, but the nonprod project's sync window restricts
  # automated reconciliation to business hours; outside the window a human must
  # promote manually. The canary Rollout adds a second gate: analysis must pass
  # before traffic reaches 100%.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
