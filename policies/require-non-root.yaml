apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  labels:
    app.kubernetes.io/part-of: gitops-kubernetes-deployment
  annotations:
    policies.kyverno.io/title: Require Non-Root Containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Pods must run as non-root and must not allow privilege escalation. The
      sample-api Deployment sets runAsNonRoot, drops all capabilities and uses a
      read-only root filesystem; this policy enforces the first two repo-wide.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "runAsNonRoot must be true at the pod or container level."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
    - name: disallow-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "allowPrivilegeEscalation must be set to false on every container."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
