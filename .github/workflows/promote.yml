name: promote-image

# PR-based environment promotion.
#
# Two ways to trigger:
#   1. workflow_dispatch — an operator picks the target environment + image tag.
#   2. push to main that changes the app/ source — CI is expected to have built
#      and pushed a new dev image; this workflow then auto-promotes it to *dev*
#      by committing the new tag directly (mirroring "automatic sync in dev").
#
# For staging/production the workflow never commits to main directly. It opens a
# Pull Request that bumps the image tag in the target overlay's kustomization.yaml.
# Merging that PR is the human approval gate; Argo CD reconciles from git afterward.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to promote"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      image_tag:
        description: "Image tag to promote (immutable, never 'latest')"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Dockerfile"

permissions:
  contents: write
  pull-requests: write

env:
  IMAGE_NAME: ghcr.io/iarsingh/sample-api

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Resolve environment and tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            TAG="${{ github.event.inputs.image_tag }}"
          else
            # Auto path: on merge to main, promote a per-commit dev tag to dev.
            ENVIRONMENT="dev"
            TAG="dev-${GITHUB_SHA::7}"
          fi
          if [ "$TAG" = "latest" ]; then
            echo "::error::Refusing to promote a mutable 'latest' tag."; exit 1
          fi
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Promoting $ENVIRONMENT -> $TAG"

      - name: Bump image tag in overlay
        id: bump
        run: |
          ENVIRONMENT="${{ steps.resolve.outputs.environment }}"
          TAG="${{ steps.resolve.outputs.tag }}"
          cd "applications/sample-api/overlays/${ENVIRONMENT}"
          kustomize edit set image "${IMAGE_NAME}=${IMAGE_NAME}:${TAG}"
          cd "$GITHUB_WORKSPACE"
          echo "Rendering to confirm the overlay still builds..."
          kustomize build "applications/sample-api/overlays/${ENVIRONMENT}" > /dev/null
          echo "changed_path=applications/sample-api/overlays/${ENVIRONMENT}/kustomization.yaml" >> "$GITHUB_OUTPUT"

      - name: Commit directly to main (dev only)
        if: steps.resolve.outputs.environment == 'dev'
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No change to commit (tag already current)."; exit 0
          fi
          git add "${{ steps.bump.outputs.changed_path }}"
          git commit -m "promote(dev): sample-api image -> ${TAG}"
          git push origin HEAD:main

      - name: Open promotion PR (staging / production)
        if: steps.resolve.outputs.environment != 'dev'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "promote(${{ steps.resolve.outputs.environment }}): sample-api image -> ${{ steps.resolve.outputs.tag }}"
          branch: "promote/${{ steps.resolve.outputs.environment }}-${{ steps.resolve.outputs.tag }}"
          base: main
          title: "promote(${{ steps.resolve.outputs.environment }}): sample-api -> ${{ steps.resolve.outputs.tag }}"
          body: |
            Automated image promotion for **${{ steps.resolve.outputs.environment }}** to `${{ steps.resolve.outputs.tag }}`.

            Merging this PR updates the git desired state. Argo CD then:
            - **staging**: auto-syncs within the business-hours window and runs the canary analysis gate.
            - **production**: marks the app OutOfSync — an operator must `argocd app sync sample-api-production`, then manually promote the blue-green Rollout.

            Review the rendered change with `make argocd-diff ENV=${{ steps.resolve.outputs.environment }}` before merging.
          labels: |
            promotion
            ${{ steps.resolve.outputs.environment }}

  # Documented, on-demand rollback entry point. Runs only on manual dispatch and
  # only surfaces the exact rollback commands (it does not assume the hosted runner
  # has cluster credentials). A team wiring real cluster access would replace the
  # echo block with an authenticated `kubectl argo rollouts undo`.
  rollback-instructions:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: promote
    steps:
      - name: Print rollback commands for this environment
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          echo "If this promotion misbehaves, roll ${ENVIRONMENT} back with:"
          echo "  kubectl argo rollouts abort sample-api -n sample-api-${ENVIRONMENT}"
          echo "  kubectl argo rollouts undo  sample-api -n sample-api-${ENVIRONMENT}"
          echo "  # then restore git desired state:"
          echo "  argocd app rollback sample-api-${ENVIRONMENT} <history-id>"
