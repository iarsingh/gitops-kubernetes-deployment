apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests for the sample-api workload. This directory is a valid,
# deployable unit on its own, but is never applied directly — overlays layer
# environment-specific patches on top of it.

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - poddisruptionbudget.yaml
  - networkpolicy.yaml

# Common metadata labels applied to every object (and to pod templates), but NOT
# to selectors. Every manifest declares its own selector explicitly, so this
# transformer cannot leak the app label into NetworkPolicy peer selectors (e.g.
# the kube-dns egress rule) or bloat the immutable workload selectors.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: sample-api
      app.kubernetes.io/part-of: gitops-kubernetes-deployment
      app.kubernetes.io/managed-by: argocd

# Environment configuration injected into the container via envFrom. Overlays
# override these values with their own configMapGenerator behavior:merge entry.
configMapGenerator:
  - name: sample-api-config
    literals:
      - APP_NAME=sample-api
      - APP_ENV=base
      - APP_VERSION=0.1.0
      - READINESS_WARMUP_SECONDS=0

# The image whose tag is bumped by the promotion workflow. Overlays override the
# tag with `kustomize edit set image`.
images:
  - name: ghcr.io/iarsingh/sample-api
    newTag: "0.1.0"
