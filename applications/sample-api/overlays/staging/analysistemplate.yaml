apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: sample-api-success-rate
  labels:
    app.kubernetes.io/name: sample-api
    app.kubernetes.io/component: analysis
spec:
  # Referenced from the canary strategy below. During each canary step this
  # measures the request success rate from Prometheus and fails the rollout if it
  # drops below the threshold, which triggers an automatic abort + rollback.
  args:
    - name: service-name
      value: sample-api
  metrics:
    - name: success-rate
      # Evaluate five times, 30s apart. A single breach fails the analysis.
      interval: 30s
      count: 5
      successCondition: result[0] >= 0.95
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(sample_api_requests_total[2m]))
            /
            clamp_min(sum(rate(sample_api_requests_total[2m])), 1)
            -
            sum(rate(sample_api_request_errors_total[2m]))
            /
            clamp_min(sum(rate(sample_api_requests_total[2m])), 1)
