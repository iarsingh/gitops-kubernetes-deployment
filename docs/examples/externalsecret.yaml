# Example External Secrets Operator (ESO) manifests.
#
# The alternative to sealed-secrets: instead of encrypting the secret INTO git,
# git holds only a *reference*. The real secret lives in an external manager
# (AWS Secrets Manager, GCP Secret Manager, HashiCorp Vault). The External
# Secrets Operator reconciles that reference into a native Kubernetes Secret.
#
# Nothing sensitive is ever committed — only the store connection and the key
# names to fetch. This is often preferred at org scale because rotation happens
# in the external store without a git commit.
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: sample-api-store
  namespace: sample-api-production
spec:
  provider:
    # Example: AWS Secrets Manager. The operator authenticates via IRSA
    # (the service account is annotated with an IAM role) — no static creds in git.
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: sample-api
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sample-api-secrets
  namespace: sample-api-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sample-api-store
    kind: SecretStore
  target:
    name: sample-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: prod/sample-api/database
        property: url
