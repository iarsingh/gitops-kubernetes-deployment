# Example SealedSecret (Bitnami sealed-secrets).
#
# A SealedSecret is safe to commit to a public git repo: the `encryptedData`
# values are asymmetrically encrypted with the cluster's public key and can ONLY
# be decrypted by the sealed-secrets controller running in the target cluster.
# Argo CD applies this manifest; the controller then materialises a normal
# Kubernetes Secret named `sample-api-secrets` in the namespace.
#
# How this file is actually produced (never hand-written, never plaintext in git):
#   kubectl create secret generic sample-api-secrets \
#     --namespace sample-api-production \
#     --from-literal=DATABASE_URL='postgres://user:pass@db:5432/app' \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-namespace kube-system --format yaml > sealedsecret.yaml
#
# The encryptedData below is illustrative (not a real ciphertext).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sample-api-secrets
  namespace: sample-api-production
spec:
  encryptedData:
    DATABASE_URL: AgBv...ENCRYPTED-CIPHERTEXT-ONLY-DECRYPTABLE-IN-CLUSTER...=
  template:
    metadata:
      name: sample-api-secrets
      namespace: sample-api-production
    type: Opaque
